name: Deploy Observability Stack

on:
  workflow_dispatch:
    inputs:
      component:
        description: "Which component to deploy: prometheus | loki | tempo | opentelemetry | grafana | postgres-exporter | all"
        required: false
        default: "all"
      fix_otel_instrumentation:
        description: "Patch Instrumentation CR endpoint → our OTel Collector (discover | yes)"
        required: false
        default: "no"
      otel_instrumentation_namespace:
        description: "Namespace of the Instrumentation CR (required when fix_otel_instrumentation=yes)"
        required: false
        default: ""
      otel_instrumentation_name:
        description: "Name of the Instrumentation CR"
        required: false
        default: "default"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "false"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Mirror charts/observability/* → helm-charts/helmcharts/observability/
  # ---------------------------------------------------------------------------
  sync-charts:
    name: Sync charts → helm-charts
    runs-on: stg-runners
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Push charts to helm-charts
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "Claude Agent CI"

          git clone \
            https://x-access-token:${{ secrets.HELMCHARTS_PAT }}@github.com/example-org/helm-charts.git \
            /tmp/hc

          mkdir -p /tmp/hc/helmcharts/observability/prometheus/values
          mkdir -p /tmp/hc/helmcharts/observability/loki/values
          mkdir -p /tmp/hc/helmcharts/observability/grafana/values
          mkdir -p /tmp/hc/helmcharts/observability/tempo/values
          mkdir -p /tmp/hc/helmcharts/observability/opentelemetry/values
          mkdir -p /tmp/hc/helmcharts/observability/postgres-exporter/values
          mkdir -p /tmp/hc/k8s

          # One-time cleanup: remove old flat dirs and rename monitoring → observability
          rm -rf /tmp/hc/helmcharts/monitoring-prometheus
          rm -rf /tmp/hc/helmcharts/monitoring-loki
          rm -rf /tmp/hc/helmcharts/monitoring

          cp -r charts/observability/prometheus/.       /tmp/hc/helmcharts/observability/prometheus/
          cp -r charts/observability/loki/.             /tmp/hc/helmcharts/observability/loki/
          cp -r charts/observability/grafana/.          /tmp/hc/helmcharts/observability/grafana/
          cp -r charts/observability/tempo/.            /tmp/hc/helmcharts/observability/tempo/
          cp -r charts/observability/opentelemetry/.    /tmp/hc/helmcharts/observability/opentelemetry/
          cp -r charts/observability/postgres-exporter/. /tmp/hc/helmcharts/observability/postgres-exporter/
          cp -r k8s/.                                   /tmp/hc/k8s/

          cd /tmp/hc
          # Remove dangling .claude submodule left by Claude Code worktrees
          git rm -rf --cached .claude 2>/dev/null || true
          rm -rf .claude
          # Strip any .claude or worktree entries from .gitmodules
          if [[ -f .gitmodules ]]; then
            grep -v -e '\.claude' -e 'worktree' .gitmodules > /tmp/gitmodules.clean || true
            mv /tmp/gitmodules.clean .gitmodules
          fi
          git add -A
          git diff --cached --quiet \
            && echo "Charts already up-to-date in helmcharts repo." \
            || git commit -m "feat: restructure monitoring charts under helmcharts/observability/{prometheus,loki,grafana}"
          git push

  # ---------------------------------------------------------------------------
  # 2. Deploy from helm-charts
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy ${{ inputs.component }}
    runs-on: stg-runners
    needs: sync-charts
    steps:
      - name: Checkout helmcharts repo
        uses: actions/checkout@v4
        with:
          repository: example-org/helm-charts
          token: ${{ secrets.HELMCHARTS_PAT }}
          path: helmcharts
          fetch-depth: 1

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.30.2

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.4

      - name: Add Helm repositories
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      # -----------------------------------------------------------------------
      # One-time migration: uninstall old releases from monitoring namespace
      # so their cluster-scoped resources (ClusterRoles etc.) are removed
      # before we reinstall in observability namespace.
      # -----------------------------------------------------------------------
      - name: Uninstall old releases from monitoring namespace
        run: |
          for release in prom-stack loki-stack tempo otelcol monitoring-grafana; do
            status=$(helm status $release -n monitoring -o json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "notfound")
            if [[ "$status" != "notfound" ]]; then
              echo "Uninstalling $release from monitoring (migrating to observability)"
              helm uninstall $release -n monitoring --wait || true
            else
              echo "$release not found in monitoring — skipping"
            fi
          done

      # -----------------------------------------------------------------------
      # Prometheus + kube-state-metrics + node-exporter
      # Service: prom-stack-kube-prometheus-prometheus.observability:9090
      # -----------------------------------------------------------------------
      - name: Clean up failed Helm releases
        run: |
          for release in prom-stack loki-stack tempo otelcol monitoring-grafana; do
            status=$(helm status $release -n observability -o json 2>/dev/null | python3 -c "import sys,json; print(json.load(sys.stdin)['info']['status'])" 2>/dev/null || echo "notfound")
            if [[ "$status" == "failed" || "$status" == "pending-upgrade" || "$status" == "pending-install" ]]; then
              echo "Removing stuck release: $release (status: $status)"
              helm uninstall $release -n observability --wait || true
            else
              echo "Release $release status: $status — skipping cleanup"
            fi
            # Delete any stale pending-* Helm secrets that cause "release: already exists"
            kubectl -n observability delete secret \
              -l "owner=helm,name=$release,status=pending-upgrade" \
              --ignore-not-found 2>/dev/null || true
            kubectl -n observability delete secret \
              -l "owner=helm,name=$release,status=pending-install" \
              --ignore-not-found 2>/dev/null || true
          done

      - name: Deploy Prometheus
        if: inputs.component == 'prometheus' || inputs.component == 'all'
        run: |
          helm dependency update helmcharts/helmcharts/observability/prometheus
          helm upgrade --install prom-stack helmcharts/helmcharts/observability/prometheus \
            -f helmcharts/helmcharts/observability/prometheus/values.yaml \
            -f helmcharts/helmcharts/observability/prometheus/values/stg-values.yaml \
            -n observability \
            --create-namespace \
            --cleanup-on-fail \
            --timeout 5m

      - name: Apply ingress-nginx metrics Service + ServiceMonitor
        if: inputs.component == 'prometheus' || inputs.component == 'all'
        run: |
          # additionalServiceMonitors in kube-prometheus-stack chart stopped rendering.
          # Apply directly instead. The SM must carry release=prom-stack to match
          # Prometheus CR serviceMonitorSelector.
          kubectl apply -f helmcharts/k8s/ingress-nginx-metrics.yaml
          echo "ingress-nginx metrics Service + ServiceMonitor applied"
          kubectl -n observability get servicemonitor ingress-nginx -o jsonpath='{.metadata.labels}' 2>/dev/null || true

      - name: Diagnose Prometheus pods
        if: inputs.component == 'prometheus' || inputs.component == 'all'
        run: |
          echo "::group::Pods"
          kubectl -n observability get pods -o wide
          echo "::endgroup::"
          echo "::group::Pending / not-ready pod details"
          kubectl -n observability get pods --field-selector=status.phase!=Running -o name 2>/dev/null | while read pod; do
            echo "--- $pod ---"
            kubectl -n observability describe $pod | tail -20
          done
          echo "::endgroup::"
          echo "::group::Events"
          kubectl -n observability get events --sort-by='.lastTimestamp' | tail -30
          echo "::endgroup::"
          echo "::group::PVCs"
          kubectl -n observability get pvc
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # Loki (log store) + Promtail DaemonSet
      # Service: loki-stack.observability:3100
      # -----------------------------------------------------------------------
      - name: Deploy Loki
        if: inputs.component == 'loki' || inputs.component == 'all'
        run: |
          helm dependency update helmcharts/helmcharts/observability/loki
          # Delete old StatefulSet so Helm can recreate with new label selectors and volumeClaimTemplates.
          # The PVC (storage-loki-stack-0) is preserved; new StatefulSet claims it automatically.
          kubectl delete statefulset loki-stack -n observability --ignore-not-found=true
          helm upgrade --install loki-stack helmcharts/helmcharts/observability/loki \
            -f helmcharts/helmcharts/observability/loki/values.yaml \
            -f helmcharts/helmcharts/observability/loki/values/stg-values.yaml \
            -n observability \
            --cleanup-on-fail \
            --timeout 5m
          # Loki cold-start can take >3 min — use 8m; || true so a slow start doesn't fail the job
          kubectl rollout status statefulset/loki-stack -n observability --timeout=8m || true

      - name: Diagnose Loki health
        if: inputs.component == 'loki' || inputs.component == 'all'
        run: |
          echo "::group::Loki pod status"
          kubectl -n observability get pods -l "app.kubernetes.io/name=loki" -o wide
          echo "::endgroup::"
          echo "::group::Loki ready endpoint"
          kubectl exec -n observability loki-stack-0 -- sh -c 'wget -qO- http://localhost:3100/ready 2>/dev/null || curl -s http://localhost:3100/ready' 2>&1 || true
          echo "::endgroup::"
          echo "::group::Loki buildinfo endpoint (Grafana 10 test-button check)"
          kubectl exec -n observability loki-stack-0 -- sh -c 'wget -qO- http://localhost:3100/loki/api/v1/status/buildinfo 2>/dev/null || curl -s http://localhost:3100/loki/api/v1/status/buildinfo' 2>&1 || true
          echo "::endgroup::"
          echo "::group::Loki labels endpoint"
          kubectl exec -n observability loki-stack-0 -- sh -c 'wget -qO- "http://localhost:3100/loki/api/v1/labels" 2>/dev/null || curl -s "http://localhost:3100/loki/api/v1/labels"' 2>&1 || true
          echo "::endgroup::"
          echo "::group::Loki pod logs (last 30 lines)"
          kubectl logs -n observability loki-stack-0 --tail=30 2>&1 || true
          echo "::endgroup::"

      # -----------------------------------------------------------------------
      # Tempo — distributed tracing backend
      # Service: tempo.observability:3100 (query) / :4317 (OTLP ingest)
      # -----------------------------------------------------------------------
      - name: Add OpenTelemetry Helm repo
        if: inputs.component == 'opentelemetry' || inputs.component == 'tempo' || inputs.component == 'all'
        run: |
          helm repo add open-telemetry https://open-telemetry.github.io/opentelemetry-helm-charts
          helm repo update

      - name: Deploy Tempo
        if: inputs.component == 'tempo' || inputs.component == 'all'
        run: |
          helm dependency update helmcharts/helmcharts/observability/tempo
          # --force allows Helm to delete+recreate the StatefulSet when immutable
          # fields change (e.g. volumeClaimTemplates after values namespace fix)
          helm upgrade --install tempo helmcharts/helmcharts/observability/tempo \
            -f helmcharts/helmcharts/observability/tempo/values.yaml \
            -f helmcharts/helmcharts/observability/tempo/values/stg-values.yaml \
            -n observability \
            --create-namespace \
            --cleanup-on-fail \
            --force \
            --timeout 5m
          # grafana/tempo chart does not embed config checksum in pod template, so
          # ConfigMap changes don't trigger a pod restart — force it explicitly.
          kubectl rollout restart statefulset/tempo -n observability
          kubectl rollout status statefulset/tempo -n observability --timeout=5m || true

      # -----------------------------------------------------------------------
      # OpenTelemetry Collector — receives OTLP traces, forwards to Tempo
      # Service: otelcol-opentelemetry-collector.observability:4317
      # -----------------------------------------------------------------------
      - name: Deploy OpenTelemetry Collector
        if: inputs.component == 'opentelemetry' || inputs.component == 'all'
        run: |
          helm dependency update helmcharts/helmcharts/observability/opentelemetry
          helm upgrade --install otelcol helmcharts/helmcharts/observability/opentelemetry \
            -f helmcharts/helmcharts/observability/opentelemetry/values.yaml \
            -f helmcharts/helmcharts/observability/opentelemetry/values/stg-values.yaml \
            -n observability \
            --create-namespace \
            --cleanup-on-fail \
            --timeout 5m

      # -----------------------------------------------------------------------
      # Grafana — pre-configured with Prometheus + Loki + Tempo datasources
      # Service: monitoring-grafana.observability:80  (admin / password in the grafana-admin Secret)
      # -----------------------------------------------------------------------
      - name: Deploy Grafana
        if: inputs.component == 'grafana' || inputs.component == 'all'
        run: |
          # Force-delete any stuck Grafana pod holding the PVC (Multi-Attach block)
          STUCK=$(kubectl -n observability get pods -l app.kubernetes.io/name=grafana \
            --field-selector=status.phase!=Running -o name 2>/dev/null || true)
          if [[ -n "$STUCK" ]]; then
            echo "Force-deleting stuck Grafana pods: $STUCK"
            echo "$STUCK" | xargs kubectl delete -n observability --force --grace-period=0 2>/dev/null || true
            sleep 5
          fi

          helm dependency update helmcharts/helmcharts/observability/grafana
          helm upgrade --install monitoring-grafana helmcharts/helmcharts/observability/grafana \
            -f helmcharts/helmcharts/observability/grafana/values.yaml \
            -f helmcharts/helmcharts/observability/grafana/values/stg-values.yaml \
            -n observability \
            --cleanup-on-fail \
            --timeout 5m

          # Delete stale registry-downloaded plugin versions from the plugins dir.
          # Grafana 11.6 bundles these at v2.1.5 internally; the old downloaded
          # v1.0.39 from the registry fails with /react/jsx-runtime 404.
          # preinstallAutoUpdate=false in grafana.ini prevents re-download on startup.
          POD=$(kubectl -n observability get pods -l app.kubernetes.io/name=grafana \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [[ -n "$POD" ]]; then
            echo "Removing stale plugin dirs from $POD ..."
            kubectl exec -n observability "$POD" -c grafana -- \
              sh -c "rm -rf /var/lib/grafana/plugins/grafana-lokiexplore-app \
                            /var/lib/grafana/plugins/grafana-exploretraces-app \
                            /var/lib/grafana/plugins/grafana-metricsdrilldown-app \
                            /var/lib/grafana/plugins/grafana-pyroscope-app || true" 2>/dev/null || \
            kubectl exec -n observability "$POD" -- \
              sh -c "rm -rf /var/lib/grafana/plugins/grafana-lokiexplore-app \
                            /var/lib/grafana/plugins/grafana-exploretraces-app \
                            /var/lib/grafana/plugins/grafana-metricsdrilldown-app \
                            /var/lib/grafana/plugins/grafana-pyroscope-app || true" 2>/dev/null || true
            echo "Plugin dirs cleared."
          else
            echo "No running Grafana pod found — skip plugin dir cleanup"
          fi

          kubectl rollout restart deployment/monitoring-grafana -n observability
          kubectl rollout status deployment/monitoring-grafana -n observability --timeout=3m

      - name: Enable Grafana Drilldown app plugins
        if: inputs.component == 'grafana' || inputs.component == 'all'
        run: |
          GRAFANA="http://monitoring-grafana.observability:80"
          AUTH="admin:$(kubectl -n observability get secret monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          echo "Waiting for Grafana to be ready..."
          for i in $(seq 1 18); do
            if curl -sf -u "$AUTH" "$GRAFANA/api/health" > /dev/null 2>&1; then break; fi
            echo "  attempt $i: not ready, waiting 10s..."; sleep 10
          done
          for plugin in grafana-lokiexplore-app grafana-exploretraces-app grafana-metricsdrilldown-app; do
            echo -n "Enabling $plugin ... "
            result=$(curl -sf -X POST -u "$AUTH" \
              -H "Content-Type: application/json" \
              -d '{"enabled":true,"pinned":true}' \
              "$GRAFANA/api/plugins/$plugin/settings" 2>&1) && \
            echo "ok" || echo "failed (may already be enabled): $result"
          done

      - name: Import Grafana Dashboards
        if: inputs.component == 'grafana' || inputs.component == 'all'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          GRAFANA="http://monitoring-grafana.observability:80"
          AUTH="admin:$(kubectl -n observability get secret monitoring-grafana -o jsonpath='{.data.admin-password}' | base64 -d)"
          REPO="${{ github.repository }}"
          DASH_PATH="charts/observability/grafana/dashboards"
          DASHBOARDS=(
            detailed-pods-resources
            kubernetes-applications
            kubernetes-cluster-summary
            nginx-ingress-controller
            node-exporter-full
            postgresql-database
          )

          echo "Waiting for Grafana to be ready..."
          for i in $(seq 1 18); do
            if curl -sf -u "$AUTH" "$GRAFANA/api/health" > /dev/null 2>&1; then
              echo "Grafana ready"; break
            fi
            echo "  attempt $i: not ready, waiting 10s..."; sleep 10
          done

          for name in "${DASHBOARDS[@]}"; do
            echo -n "  importing $name ... "
            # Fetch JSON from GitHub API (base64-encoded content field)
            json=$(curl -sf \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/${REPO}/contents/${DASH_PATH}/${name}.json?ref=${GITHUB_SHA}" \
              | jq -r '.content' | tr -d '\n' | base64 -d 2>/dev/null)
            if [[ -z "$json" ]]; then
              echo "could not fetch from GitHub API — skipping"
              continue
            fi
            result=$(echo "$json" | \
              jq '{dashboard: (. + {id: null}), overwrite: true, folderId: 0}' | \
              curl -sf -X POST -u "$AUTH" \
                -H "Content-Type: application/json" \
                --data-binary @- \
                "$GRAFANA/api/dashboards/db" 2>&1) || true
            echo "$(echo "$result" | jq -r '.status // "error"' 2>/dev/null)"
          done

      - name: Deploy PostgreSQL Exporter
        if: inputs.component == 'postgres-exporter' || inputs.component == 'all'
        run: |
          SECRET=$(kubectl get secret postgres-exporter-credentials -n observability \
            --ignore-not-found -o jsonpath='{.metadata.name}')
          if [[ -z "$SECRET" ]]; then
            echo "::warning::Secret 'postgres-exporter-credentials' not found in observability namespace."
            echo "Create it first, then re-run this workflow:"
            echo ""
            echo "  kubectl create secret generic postgres-exporter-credentials \\"
            echo "    -n observability \\"
            echo '    --from-literal=DATA_SOURCE_NAME="postgresql://exporter:<exporter-password>@postgres.example.svc:5432/postgres?sslmode=disable"'
            echo ""
            echo "Skipping postgres-exporter deployment."
            exit 0
          fi
          helm dependency update helmcharts/helmcharts/observability/postgres-exporter
          helm upgrade --install pg-exporter helmcharts/helmcharts/observability/postgres-exporter \
            -f helmcharts/helmcharts/observability/postgres-exporter/values.yaml \
            -f helmcharts/helmcharts/observability/postgres-exporter/values/stg-values.yaml \
            -n observability \
            --cleanup-on-fail \
            --timeout 3m

      # -----------------------------------------------------------------------
      # Fix OTel Instrumentation CR endpoint
      # Patches spec.exporter.endpoint → otelcol-opentelemetry-collector.observability:4318
      # Run with fix_otel_instrumentation=discover to find CRs, =yes to patch.
      # -----------------------------------------------------------------------
      - name: Fix OTel Instrumentation endpoint
        if: always() && (inputs.fix_otel_instrumentation == 'discover' || inputs.fix_otel_instrumentation == 'yes')
        run: |
          TARGET="http://otelcol-opentelemetry-collector.observability:4318"

          echo "::group::OTel Operator CRDs present"
          kubectl get crd instrumentations.opentelemetry.io 2>/dev/null \
            && echo "YES — opentelemetry.io CRDs installed" \
            || echo "NO — OTel Operator CRDs not found"
          echo "::endgroup::"

          echo "::group::All Instrumentation CRs (cluster-wide)"
          kubectl get instrumentation -A -o wide 2>/dev/null || echo "None found"
          echo "::endgroup::"

          echo "::group::Instrumentation CR exporter endpoints"
          kubectl get instrumentation -A -o json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for item in data.get('items', []):
              ns = item['metadata']['namespace']
              name = item['metadata']['name']
              ep = item.get('spec', {}).get('exporter', {}).get('endpoint', '(not set)')
              print(f'  {ns}/{name}  ->  {ep}')
          " || echo "No Instrumentation CRs"
          echo "::endgroup::"

          echo "::group::Deployments with inject-nodejs annotation on pod template (all namespaces)"
          kubectl get deployments -A -o json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for dep in data.get('items', []):
              ann = dep.get('spec', {}).get('template', {}).get('metadata', {}).get('annotations', {})
              if 'instrumentation.opentelemetry.io/inject-nodejs' in ann:
                  ns = dep['metadata']['namespace']
                  name = dep['metadata']['name']
                  val = ann['instrumentation.opentelemetry.io/inject-nodejs']
                  print(f'  {ns}/{name}  inject-nodejs={val}')
          " || true
          echo "::endgroup::"

          if [[ "${{ inputs.fix_otel_instrumentation }}" != "yes" ]]; then
            echo "fix_otel_instrumentation=discover — discovery only, skipping patch."
            exit 0
          fi

          NS="${{ inputs.otel_instrumentation_namespace }}"
          NAME="${{ inputs.otel_instrumentation_name }}"

          if [[ -z "$NS" ]]; then
            echo "::error::otel_instrumentation_namespace is required when fix_otel_instrumentation=yes"
            exit 1
          fi

          echo "Creating/updating Instrumentation $NS/$NAME -> $TARGET"
          cat <<EOF | kubectl apply -f -
          apiVersion: opentelemetry.io/v1alpha1
          kind: Instrumentation
          metadata:
            name: ${NAME}
            namespace: ${NS}
          spec:
            exporter:
              endpoint: ${TARGET}
            propagators:
              - tracecontext
              - baggage
            sampler:
              type: parentbased_traceidratio
              argument: "1"
          EOF

          echo "::group::Applied Instrumentation CR"
          kubectl get instrumentation "$NAME" -n "$NS" -o yaml
          echo "::endgroup::"

          echo "::group::Rolling restart of deployments with inject-nodejs annotation in $NS"
          kubectl get deployments -n "$NS" -o json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for dep in data.get('items', []):
              ann = dep.get('spec', {}).get('template', {}).get('metadata', {}).get('annotations', {})
              if 'instrumentation.opentelemetry.io/inject-nodejs' in ann:
                  print(dep['metadata']['name'])
          " | while read -r dep; do
            echo "Restarting deployment/$dep"
            kubectl rollout restart deployment/"$dep" -n "$NS"
            kubectl rollout status deployment/"$dep" -n "$NS" --timeout=120s
          done
          echo "::endgroup::"

          echo "::group::OTLP env vars injected into pods in $NS"
          kubectl get pods -n "$NS" -o json | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for pod in data.get('items', []):
              for c in pod.get('spec', {}).get('containers', []):
                  for env in c.get('env', []):
                      if 'OTLP' in env.get('name', '') or 'OTEL_EXPORTER' in env.get('name', ''):
                          pname = pod['metadata']['name']
                          cname = c['name']
                          val = env.get('value', '(valueFrom)')
                          print(f'  {pname}/{cname}: {env[\"name\"]}={val}')
          "
          echo "::endgroup::"

      - name: Diagnose ingress controller
        run: |
          echo "::group::IngressClasses"
          kubectl get ingressclass 2>&1 || echo "none"
          echo "::endgroup::"
          echo "::group::Ingress controllers (all namespaces)"
          kubectl get pods -A | grep -iE 'ingress|nginx|traefik|contour' || echo "none found"
          echo "::endgroup::"
          echo "::group::LoadBalancer services (all namespaces)"
          kubectl get svc -A --field-selector spec.type=LoadBalancer
          echo "::endgroup::"
          echo "::group::Existing ingresses (all namespaces)"
          kubectl get ingress -A 2>&1 || echo "none"
          echo "::endgroup::"

      - name: Verify pods
        run: |
          echo "::group::observability namespace pods"
          kubectl -n observability get pods -o wide
          echo "::endgroup::"
          echo "::group::Services"
          kubectl -n observability get svc
          echo "::endgroup::"
          echo "::group::node-exporter pending nodes"
          kubectl -n observability get pods -l app.kubernetes.io/name=prometheus-node-exporter -o wide
          echo "::endgroup::"

      - name: Diagnose claude-agent errors
        run: |
          echo "::group::claude-agent pods"
          kubectl -n monitoring get pods -l app=claude-agent --sort-by=.metadata.creationTimestamp
          echo "::endgroup::"
          echo "::group::Last failed claude-agent log"
          FAILED=$(kubectl -n monitoring get pods -l app=claude-agent --sort-by=.metadata.creationTimestamp -o name | tail -1)
          if [[ -n "$FAILED" ]]; then
            kubectl -n monitoring logs $FAILED --tail=50 2>/dev/null || echo "(pod not yet ready for logs)"
          fi
          echo "::endgroup::"
          echo "::group::Node taints"
          kubectl get nodes -o custom-columns=NAME:.metadata.name,TAINTS:.spec.taints
          echo "::endgroup::"
