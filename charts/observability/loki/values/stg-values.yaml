loki:
  singleBinary:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  loki:
    ingress:
      enabled: true
      ingressClassName: ingress-nginx
      annotations:
        kubernetes.io/ingress.class: ingress-nginx
      hosts:
        - host: loki-stg.example.com
          paths:
            - path: /
              pathType: Prefix

promtail:
  resources:
    requests:
      cpu: 30m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
