kube-prometheus-stack:
  alertmanager:
    enabled: false

  # Grafana is deployed as its own chart (charts/observability/grafana)
  grafana:
    enabled: false

  prometheus:
    prometheusSpec:
      retention: 15d
      scrapeInterval: 30s
      evaluationInterval: 30s
      podMonitorNamespaceSelector: {}
      serviceMonitorNamespaceSelector: {}
      podMonitorSelector: {}
      serviceMonitorSelector: {}

  # Drop the duplicate kubelet scrape.
  #
  # kube-system holds TWO kubelet Services, ours and Rancher's, and both carry
  # identical labels (app.kubernetes.io/name=kubelet, k8s-app=kubelet):
  #   prom-stack-kube-prometheus-kubelet
  #   rancher-monitoring-kubelet
  # Our kubelet ServiceMonitor selects on exactly those labels, so it matches both
  # and scrapes every node twice. Result: 9 nodes -> 18 machine_memory_bytes
  # series, and every sum() over a kubelet/cAdvisor metric doubled. The cluster
  # summary dashboard read 1.01 TiB for a real ~505 GiB and 776 cores for ~388.
  #
  # We cannot tighten the ServiceMonitor's selector: it is generated by the chart,
  # and the two Services are indistinguishable on the labels it matches. We also
  # must not touch the Rancher Service — it is Helm-managed by the rancher-monitoring
  # release, and its own Prometheus needs it.
  #
  # So drop the duplicate at ingestion, per endpoint. metricRelabelings run after
  # target labels are attached, so `service` is available here. This only discards
  # samples — it cannot affect the node/instance labels the chart's own target
  # relabelings set, which is why it is preferred over a target-level drop.
  #
  # Cost: the duplicate target is still scraped, then thrown away. Wasted network
  # and kubelet CPU, but no storage and correct query results. Removing the Rancher
  # monitoring stack would be the real fix — it would also remove a second
  # Prometheus whose selectors are {} / {}, i.e. it scrapes every ServiceMonitor in
  # the cluster, including ours.
  kubelet:
    enabled: true
    serviceMonitor:
      metricRelabelings:
        - sourceLabels: [service]
          regex: rancher-monitoring-kubelet
          action: drop
      cAdvisorMetricRelabelings:
        - sourceLabels: [service]
          regex: rancher-monitoring-kubelet
          action: drop
      probesMetricRelabelings:
        - sourceLabels: [service]
          regex: rancher-monitoring-kubelet
          action: drop

  nodeExporter:
    enabled: true

  kubeStateMetrics:
    enabled: true

  prometheusOperator:
    admissionWebhooks:
      enabled: false
      patch:
        enabled: false
    tls:
      enabled: false
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi

  prometheus-node-exporter:
    tolerations:
      - effect: NoSchedule
        operator: Exists
      - effect: NoExecute
        operator: Exists
