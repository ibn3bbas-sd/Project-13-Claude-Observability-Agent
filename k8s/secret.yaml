---
# IMPORTANT: Do NOT commit real values here.
# Use `kubectl create secret` or inject via CI/CD.
#
# To create the secret manually:
#   kubectl create secret generic claude-agent-secrets \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-... \
#     --from-literal=MS_GRAPH_TENANT_ID=... \
#     --from-literal=MS_GRAPH_CLIENT_ID=... \
#     --from-literal=MS_GRAPH_REFRESH_TOKEN=... \
#     --from-literal=MS_GRAPH_TEAM_ID=... \
#     --from-literal=MS_GRAPH_CHANNEL_ID=... \
#     -n monitoring
#
# Or apply this template after base64-encoding your values:
#   echo -n 'sk-ant-...' | base64
apiVersion: v1
kind: Secret
metadata:
  name: claude-agent-secrets
  namespace: monitoring
  labels:
    app: claude-agent
type: Opaque
data:
  ANTHROPIC_API_KEY: <base64-encoded-key>
  # Teams Incoming Webhook (preferred — set this and Graph API creds become optional)
  MS_TEAMS_WEBHOOK_URL: <base64-encoded-webhook-url>
  # Graph API delegated flow (fallback — required only if MS_TEAMS_WEBHOOK_URL is not set)
  MS_GRAPH_TENANT_ID: <base64-encoded-value>
  MS_GRAPH_CLIENT_ID: <base64-encoded-value>
  MS_GRAPH_REFRESH_TOKEN: <base64-encoded-value>
  MS_GRAPH_TEAM_ID: <base64-encoded-value>
  MS_GRAPH_CHANNEL_ID: <base64-encoded-value>